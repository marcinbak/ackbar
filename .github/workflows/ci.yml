name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    name: Go Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install Dependencies
        run: go mod tidy

      - name: Verify Code Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Run 'go fmt ./...':"
            gofmt -l .
            exit 1
          fi

      - name: Run Tests
        run: go test -v -race ./...

      - name: Verify Build
        run: |
          CGO_ENABLED=0 go build -o /dev/null ./cmd/ackbard
          CGO_ENABLED=0 go build -o /dev/null ./cmd/ackbar
          CGO_ENABLED=0 go build -o /dev/null ./cmd/ackbar-hook
          CGO_ENABLED=0 go build -o /dev/null ./cmd/ackbar-relay

  test-mobile:
    name: Flutter Mobile Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Flutter Analyzer
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        working-directory: mobile
        run: flutter test
